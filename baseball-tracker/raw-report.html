*{box-sizing:border-box}
body{margin:0;background:#c9c6c0;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:13px}
.disp{font-family:var(--disp);text-transform:uppercase;letter-spacing:.005em;line-height:.92}
.num{font-variant-numeric:tabular-nums}
/* toolbar */
.toolbar{position:static;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:3px solid var(--blueDeep)}
.toolbar .bug{width:30px;height:30px;background:var(--logo-drip) center/contain no-repeat}
.toolbar .t{font-family:var(--disp);font-size:16px;letter-spacing:.02em}
.toolbar .sp{margin-left:auto}
.toolbar select,.tbtn{background:#ffffff14;border:1px solid #ffffff30;color:#fff;border-radius:8px;padding:7px 12px;font-size:12.5px;cursor:pointer;font-family:var(--body)}
.toolbar select option{color:#111}
.tbtn.pri{background:var(--blueDeep);border-color:var(--blueDeep);font-weight:800}
/* pages */
#doc{padding:26px 0 60px}
.page{position:relative;width:8.5in;min-height:11in;margin:0 auto 22px;background:var(--paper);box-shadow:0 10px 34px rgba(0,0,0,.28);overflow:hidden}
.pad{padding:.5in .6in .7in}
.page::before{content:"";position:absolute;top:0;left:0;right:0;height:9px;background:linear-gradient(90deg,var(--blue) 0 30%,var(--ink) 30% 100%);z-index:3}
.page.cover::before{display:none}
.page.cover{display:flex;flex-direction:column;min-height:11in}
.foot{position:absolute;left:.66in;right:.66in;bottom:.42in;display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#a3a29c;border-top:1px solid var(--line);padding-top:7px}
.foot .mid{color:#bdbcb6}
.foot b{font-family:var(--disp);letter-spacing:.02em;color:var(--ink);font-size:11px}
.foot b span{color:var(--blueDeep)}
/* eyebrow + titles */

<script>

  '<div class="coverband"><div class="strip"></div>'+
    '<div class="cbstats">'+

  '</div></section>');

  /* ===================== PAGE 2 &#183; WHAT THE RAW SCORE MEASURES ===================== */
  page('', eyebrow('For the reader')+
    '<h1 class="t">What the RAW<br>Score measures</h1><div class="rule"></div>'+
    '<div class="two"><div>'+
      '<p class="lede">The RAW Score&#8482; is NJ Raw Baseball&#8217;s proprietary player-development index. It combines game performance, measurable baseball tools, athletic capacity, baseball understanding, learning behaviour, mental performance, team contribution, communication, and development over time into a single profile.</p>'+
      '<p class="lede">It is not a traditional scouting grade and not a permanent judgment. It is a repeatable measurement of current development across eight domains, adjusted for the quality, quantity, and recency of the underlying data. Every domain carries its own score, sample, comparison basis, and confidence level.</p>'+
      '<p class="lede">The index deliberately measures the complete player. A player may show advanced tools while preparation, coachability, or team contribution remain limiting factors &#8212; and this report shows both clearly rather than resolving the tension in either direction.</p>'+
    '</div><div>'+
      '<div class="box not"><div class="bt">This score is NOT</div><ul>'+
        ['A permanent label on the player','A judgment of personal worth','A recruiting or scholarship guarantee','A prediction based on one game','A replacement for coaching judgment'].map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div>'+
      '<div class="box is" style="margin-top:9px"><div class="bt">This score IS</div><ul>'+
        ['A current, dated development measurement','A multidimensional profile across eight domains','Traceable to raw measurements and protocols','Benchmarked to a stated comparison group','Repeatable across evaluation cycles'].map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div>'+
    '</div></div>'+
    '<div style="margin-top:10px">'+eyebrow('The core sequence')+

    '</tbody></table>');

  /* ===================== PAGE 3 &#183; EXECUTIVE INTERPRETATION ===================== */
  var strongest=P.domains.slice().sort(function(a,b){return b.cur-a.cur;}).slice(0,4);
  var priority=P.domains.slice().sort(function(a,b){return a.cur-b.cur;}).slice(0,4);
  page('', '<div style="display:flex;align-items:flex-start;gap:20px">'+
      '<div style="flex:1">'+eyebrow('Executive interpretation')+'<h1 class="t">'+P.name+'</h1></div>'+
      '<div class="headshot"><div class="d"></div></div></div>'+
    '<div class="rule"></div>'+
    '<div class="cards4">'+
      [['num',P.raw,'RAW Score&#8482;',P.period],['num',P.potential,'Potential Index','Developing conf.'],['g',P.velocity,'Dev. Velocity','Past 12 weeks'],['',P.confidence,'Data Confidence','6 of 8 complete']]
      .map(function(s){return '<div class="sc4"><div class="n '+(s[0]==='g'?'g':'')+'">'+s[1]+'</div><div class="k">'+s[2]+'</div><div class="d">'+s[3]+'</div></div>';}).join('')+'</div>'+
    '<div class="quote">Jack presents as a high-upside two-way player whose strongest attributes are pitching tools, rotational power, and response to technical instruction. Game performance and controlled testing both indicate advanced arm strength and above-average pitch effectiveness for his age group. His profile is currently uneven: performance ability meaningfully exceeds team-impact, communication, and adversity-response measures. Development velocity over the past twelve weeks is positive &#8212; driven by command, lower-body power, and baseball-intelligence gains &#8212; while team impact has moved in the opposite direction. Continued progress will depend less on acquiring additional physical ability than on converting existing ability into consistent preparation, composure, and team contribution.</div>'+

    // labels

      '<ul class="bl" style="list-style:none;padding:0;margin:0 0 8px">'+['Use neutral or constructive language following teammate errors','Offer one specific positive teammate-communication each game','Avoid visible negative reaction to mistakes or coaching decisions'].map(function(x){return '<li style="font-size:12px;padding:3px 0;display:flex;gap:8px"><span style="color:'+C.blueDeep+'">&#8250;</span>'+x+'</li>';}).join('')+'</ul>'+
      '<div class="cc"><div><div class="k">Measurement</div>Team Impact rating, documented reminders</div><div><div class="k">Accountability</div>Player, head coach</div></div></div>'+
    '<div class="str" style="margin-top:10px"><div class="h"><span class="lbl">Goal 2</span><span class="nm">Response to adversity</span><span class="sc" style="font-size:14px;color:'+C.mute+'">8 weeks</span></div>'+
      '<ul class="bl" style="list-style:none;padding:0;margin:0 0 8px">'+['Standardised reset routine after errors and unsuccessful at-bats','One breath, next task cue, re-engage within ten seconds','Review flagged sequences on video where available'].map(function(x){return '<li style="font-size:12px;padding:3px 0;display:flex;gap:8px"><span style="color:'+C.blueDeep+'">&#8250;</span>'+x+'</li>';}).join('')+'</ul>'+
      '<div class="cc"><div><div class="k">Measurement</div>Recovery time, in-game observation</div><div><div class="k">Accountability</div>Player, mental-performance coach</div></div></div>');

  /* PAGE 14 &#183; 8-12 week plan + commitment */
  page('', '<div class="dhead"><span class="eyb">Next cycle</span></div><h1 class="t">8&#8211;12 week plan</h1>'+
    '<p class="lede" style="max-width:82ch">Three priorities. Not every category requires a goal.</p><div class="rule"></div>'+
    '<table class="dt"><thead><tr><th>Priority</th><th>Weekly action</th><th class="r">Frequency</th><th class="r">Owner</th></tr></thead><tbody>'+
      [['Team communication','Leadership behaviour objective','Every team event','Player'],['Reset routine','Practise after errors and failed reps','3&#215; weekly','Player &#183; coach'],['Single-leg strength','Split squat & lateral control session','2&#215; weekly','Performance coach'],['Pitch command','Targeted bullpen sequence','2&#215; weekly','Pitching coach'],['Team IQ','Off-ball positioning module','1&#215; weekly','Player']].map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td style="color:#444">'+r[1]+'</td><td class="r">'+r[2]+'</td><td class="r" style="color:#555">'+r[3]+'</td></tr>';}).join('')+'</tbody></table>'+
    '<div class="commit"><div class="ey" style="margin-bottom:6px">Player commitment</div>I understand the development priorities identified in this report. I will complete the agreed actions, accept feedback, and participate in the next evaluation cycle.'+
      '<div class="sign"><div class="s">Player signature</div><div class="s">Coach signature</div><div class="s">Parent acknowledgement</div></div></div>');

  /* PAGE 15 &#183; CLOSING (dark) */
  PAGES.push('<section class="page closing"><div class="pad">'+
    '<div class="seal"></div>'+
    '<div class="big">Development is not defined by one game, one season, or <span>one score.</span></div>'+
    '<div class="meta" style="margin-top:auto">Next assessment <b>'+P.next+'</b> &#183; info@rawbaseball.com &#183; Generated '+P.issued+' &#183; model v1.0<br><br>RAW Score&#8482;, RAW Report&#8482;, and RAW DNA&#8482; are trademarks of NJ Raw Baseball Co. Confidential player-development information.</div>'+
  '</div></section>');

  /* ===================== assemble ===================== */
  document.getElementById("doc").innerHTML=PAGES.join('');
  // footers with page numbers (skip cover)
  var pages=document.querySelectorAll('.page');
  pages.forEach(function(pg,i){
    if(pg.classList.contains('cover')||pg.classList.contains('closing'))return;
    var f=document.createElement('div');f.className='foot';
    f.innerHTML='<span>'+P.name.toUpperCase()+' &#183; '+P.period.toUpperCase()+'</span><span class="mid">Confidential player development information</span><b>NJ <span>RAW</span> '+('0'+(i+1)).slice(-2)+'</b>';
    pg.appendChild(f);
  });
  // player select (single sample for now)
  var sel=document.getElementById("who");var o=document.createElement("option");o.textContent="#24 "+P.name;sel.appendChild(o);
  document.getElementById("pdfBtn").onclick=function(){window.print();};
})();
</script>
