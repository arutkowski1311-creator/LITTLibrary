name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `npm test` imports the built worker in plain Node, which cannot resolve
      # `cloudflare:workers`. The build is the gate that actually catches breakage.
      - name: Build
        run: npm run build
